staging-job:
  stage: deploy_staging
  image: alpine:latest
  extends:
    - .default-rules
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p "$HOME/.ssh"
    - cp "$SSH_PRIVATE_KEY" "$HOME/.ssh/id_rsa"
    - chmod 600 "$HOME/.ssh/id_rsa"
    - ssh-keyscan -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"
  script:
    - ssh -o StrictHostKeyChecking=no $SERVER_USER@$STAGING_HOST "
      cd /app &&
      docker compose -f docker-compose.staging.yaml pull &&
      docker compose -f docker-compose.staging.yaml up -d
      "
  environment:
    name: staging
    url: http://$STAGING_HOST
  only:
    - staging

deploy-prod-job:
  stage: deploy_prod
  image: alpine:latest
  extends:
    - .default-rules
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p "$HOME/.ssh"
    - cp "$SSH_PRIVATE_KEY" "$HOME/.ssh/id_rsa"
    - chmod 600 "$HOME/.ssh/id_rsa"
    - ssh-keyscan -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"
  script:
    - ssh $SERVER_USER@$PROD_HOST "
      cd /app &&
      docker compose -f docker-compose.prod.yaml pull &&
      docker compose -f docker-compose.prod.yaml up -d
      "
  environment:
    name: production
    url: http://$PROD_HOST
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "push" && $CI_ENVIRONMENT_SLUG == "staging"'
      when: manual # requires human to click play
    - if: '$CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "push" && $CI_ENVIRONMENT_SLUG == "production"'
      when: manual # requires human to click play

